<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OM Shop Tarjeta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500;600&display=swap">
<style>
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
/* Layout: una tarjeta del alto de la pantalla que abre como una historia de Instagram (fotos a pantalla completa, barras de progreso, toques a los lados); al deslizar para entrar, sube una hoja blanca con los accesos */
:root{
  --noche:#0B0A09;
  --papel:#FFFFFF;
  --tinta:#111111;
  --gris:#7D7B78;
  --linea:#E4E2DF;
  --champan:#C9B48A;
  --champan-osc:#A88D5C;
  --display:"Italiana","Didot","Bodoni 72",Georgia,serif;
  --texto:"Jost","Poppins","Helvetica Neue",Arial,sans-serif;
  --abrir:1.7s;
  --curva:cubic-bezier(.72,0,.18,1);
  --suave:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 50% 42%,#2B241C 0%,#141110 46%,#060505 100%);background-color:#060505;color:#fff;font-family:var(--texto);-webkit-font-smoothing:antialiased;
  padding-inline:16px;display:grid;place-items:center;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--champan);outline-offset:3px}

/* Vacío 3D: chispas de fondo, tarjeta flotando y luz que corre por el borde */
#chispas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.escenario{position:relative;z-index:1;width:100%;max-width:440px;height:calc(100% - 48px);max-height:880px;min-height:600px;margin-block:24px;perspective:1400px;display:flex}
.escenario::after{content:"";position:absolute;left:8%;right:8%;bottom:-30px;height:44px;border-radius:50%;background:radial-gradient(closest-side,rgba(232,206,150,.42),rgba(232,206,150,0));filter:blur(8px);animation:piso 4.5s ease-in-out infinite;pointer-events:none}
@keyframes piso{0%,100%{opacity:.55;transform:scaleX(.92)}50%{opacity:1;transform:scaleX(1.04)}}
.flota{position:relative;flex:1;display:flex;transform-style:preserve-3d;animation:flotar 9s ease-in-out infinite}
@keyframes flotar{0%,100%{transform:rotateX(2.5deg) rotateY(-3.5deg) translateY(0)}50%{transform:rotateX(-1.5deg) rotateY(3.5deg) translateY(-10px)}}
.dentro .flota{animation-play-state:paused}
.aura{position:relative;flex:1;display:flex;padding:2px;border-radius:26px;overflow:hidden;isolation:isolate;background:rgba(201,180,138,.28);
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .6s var(--suave);
  box-shadow:0 50px 100px rgba(0,0,0,.75),0 0 70px rgba(232,206,150,.22)}
.dentro .aura{--rx:0deg;--ry:0deg}
.aura::before,.aura::after{content:"";position:absolute;left:50%;top:50%;width:1600px;height:1600px;margin:-800px 0 0 -800px;z-index:-1;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0 60%,rgba(201,180,138,.25) 66%,#F4E4BE 71%,#FFFFFF 72.5%,#C9B48A 75%,transparent 82%,transparent 100%);
  animation:girar 4.2s linear infinite}
.aura::after{animation-delay:-2.1s;opacity:.7}
.tarjeta{position:relative;flex:1;min-width:0;overflow:hidden;background:var(--noche);border-radius:24px}
.tarjeta::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(115deg,transparent 36%,rgba(255,255,255,.18) 48%,rgba(255,255,255,0) 60%);transform:translateX(-130%);animation:reflejo 6.5s ease-in-out 1.2s infinite}
.tarjeta.abierta::after{display:none}
@keyframes reflejo{0%{transform:translateX(-130%)}35%,100%{transform:translateX(130%)}}
@media (max-width:480px){body{padding-inline:10px}.escenario{height:calc(100% - 24px);margin-block:12px;min-height:560px}.aura{border-radius:22px}.tarjeta{border-radius:20px}}

/* Fotos de la colección (historias) */
.fotos{position:absolute;inset:0;background:#E9E6E1}
.fotos figure{position:absolute;inset:0;margin:0;opacity:0;transition:opacity .7s ease}
.fotos figure.on{opacity:1}
.fotos img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.1);transition:transform 5s linear}
.fotos figure.on img{transform:scale(1)}
.fotos::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 52%,rgba(0,0,0,.6) 100%)}

/* Interfaz tipo Stories */
.historia{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .5s ease}
.abierta .historia{opacity:0;pointer-events:none}
.cabeza{padding:12px 12px 0;display:flex;flex-direction:column;gap:12px;position:relative;z-index:2;transition:transform .6s var(--suave)}
.abierta .cabeza{transform:translateY(-30px)}
.progreso{display:flex;gap:4px}
.progreso span{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.38);overflow:hidden}
.progreso i{display:block;height:100%;background:#fff;transform:scaleX(0);transform-origin:left}
.perfil{display:flex;align-items:center;gap:10px;min-width:0}
.aro{position:relative;width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center}
.aro::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#F4E4BE,#C9B48A,#8C7448,#E8D3A6,#F4E4BE);animation:girar 6s linear infinite}
.aro svg{position:relative;width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-sizing:content-box;display:block}
.perfil-tx{display:flex;flex-direction:column;gap:1px;min-width:0;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.perfil-tx b{font-size:13.5px;font-weight:600;letter-spacing:.02em}
.perfil-tx small{font-size:11.5px;opacity:.85}
.verificado{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:var(--champan);color:#111;font-size:9px;margin-left:4px;vertical-align:1px}
.toques{position:absolute;inset:0;display:flex;z-index:1}
.toques button{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.toques .atras{flex:0 0 32%}.toques .adelante{flex:1}
.pie-hist{position:relative;z-index:2;padding:0 18px 22px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;transition:transform .6s var(--suave)}
.abierta .pie-hist{transform:translateY(40px)}
.marca-hist{font-family:var(--display);font-weight:400;color:#fff;font-size:clamp(52px,15vw,66px);line-height:.9;letter-spacing:.06em;text-shadow:0 4px 30px rgba(0,0,0,.3)}
.etiqueta{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);color:var(--tinta);padding:9px 14px 9px 11px;border-radius:999px;font-size:12px;font-weight:500;letter-spacing:.04em;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:opacity .35s,transform .45s var(--suave)}
.etiqueta svg{width:15px;height:15px;flex:none}
.etiqueta b{font-weight:600}
.etiqueta.cambia{opacity:0;transform:translateY(8px) scale(.96)}
.deslizar{appearance:none;cursor:pointer;position:relative;display:flex;align-items:center;gap:12px;padding:6px 22px 6px 6px;border-radius:999px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  color:#fff;font:600 11px/1 var(--texto);letter-spacing:.26em;text-transform:uppercase;overflow:hidden;isolation:isolate;
  box-shadow:0 12px 30px rgba(0,0,0,.35),0 0 0 0 rgba(244,228,190,.6);animation:halo 2.4s ease-out infinite;transition:background .3s}
.deslizar::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;z-index:-1;background:linear-gradient(105deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-130%) skewX(-15deg);animation:barrido 2.8s ease-in-out .6s infinite}
.deslizar .flecha{position:relative;width:40px;height:40px;border-radius:50%;background:#fff;color:#111;overflow:hidden;flex:none;box-shadow:0 0 22px rgba(244,228,190,.85)}
.deslizar .flecha svg{position:absolute;left:12px;top:12px;width:16px;height:16px;animation:chevron 1.6s ease-in-out infinite}
.deslizar .flecha svg+svg{animation-delay:.8s}
.deslizar:hover{background:rgba(255,255,255,.28)}
@keyframes halo{0%{box-shadow:0 12px 30px rgba(0,0,0,.35),0 0 0 0 rgba(244,228,190,.6)}75%,100%{box-shadow:0 12px 30px rgba(0,0,0,.35),0 0 0 18px rgba(244,228,190,0)}}
@keyframes barrido{0%{transform:translateX(-130%) skewX(-15deg)}55%,100%{transform:translateX(330%) skewX(-15deg)}}
@keyframes chevron{0%{transform:translateY(13px);opacity:0}35%,60%{opacity:1}100%{transform:translateY(-13px);opacity:0}}
.pausa .fotos figure.on img{transition-duration:0s}

/* Contenido al entrar */
.contenido{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;pointer-events:none}
.abierta .contenido{pointer-events:auto}
.arriba{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 20px 22px;gap:8px;min-height:0}
.arriba > *{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform 1.1s var(--suave)}
.abierta .arriba > *{opacity:1;transform:none}
.abierta .arriba > :nth-child(1){transition-delay:1.0s}.abierta .arriba > :nth-child(2){transition-delay:1.15s}.abierta .arriba > :nth-child(3){transition-delay:1.3s}
.logo{width:76px;height:76px;filter:drop-shadow(0 12px 30px rgba(0,0,0,.5))}
.bienvenidos{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(54px,15vw,72px);line-height:.9}
.ceja{font-size:10.5px;letter-spacing:.42em;text-transform:uppercase;font-weight:500;display:flex;align-items:center;gap:12px}
.ceja .barras{display:flex;gap:5px}
.ceja .barras i{display:block;width:16px;height:2px;background:rgba(255,255,255,.35);position:relative;overflow:hidden}
.ceja .barras i.on{background:#fff}
@keyframes llenar{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.hoja{background:var(--papel);color:var(--tinta);transform:translateY(102%);transition:transform 1.1s var(--suave) 1.2s}
.abierta .hoja{transform:none}
.cinta{background:var(--tinta);color:#fff;overflow:hidden;white-space:nowrap;padding:11px 0}
.cinta-in{display:inline-flex;animation:correr 24s linear infinite}
.cinta span{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;font-weight:500;padding-right:36px}
.cinta span::after{content:"✦";color:var(--champan);margin-left:36px}
@keyframes correr{to{transform:translateX(-50%)}}
.accesos{list-style:none;margin:0;padding:0 20px 8px}
.accesos li+li{border-top:1px solid var(--linea)}
.acceso{display:flex;align-items:center;gap:14px;text-decoration:none;padding:15px 0;min-width:0}
.acceso .ic{width:38px;height:38px;flex:none;display:grid;place-items:center;border:1px solid var(--linea);border-radius:50%}
.acceso .ic svg{width:18px;height:18px}
.acceso .tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.acceso b{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.acceso small{font-size:13px;color:var(--gris);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acceso .fl{font-size:18px;transition:transform .3s}
.acceso:hover .fl{transform:translateX(4px)}
.acceso.principal{background:var(--tinta);color:#fff;margin:0 -20px 4px;padding:18px 20px}
.acceso.principal .ic{border-color:rgba(255,255,255,.3)}
.acceso.principal small{color:#B9B2A6}
.acceso.principal + li, li:has(.principal) + li{border-top:0}
.acceso.estatico{cursor:default}
.credito{margin:0;padding:0 20px 16px;font-size:9.5px;letter-spacing:.14em;color:var(--gris);text-align:center}
.credito a{text-decoration:none;color:var(--tinta);font-weight:500}
.credito a:hover{color:var(--champan-osc)}
.rif{margin:0;padding:0 20px 6px;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gris);text-align:center}

/* Accesos con luz y movimiento */
.accesos li{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .9s var(--suave)}
.abierta .accesos li{opacity:1;transform:none}
.abierta .accesos li:nth-child(1){transition-delay:1.75s}.abierta .accesos li:nth-child(2){transition-delay:1.9s}
.abierta .accesos li:nth-child(3){transition-delay:2.05s}.abierta .accesos li:nth-child(4){transition-delay:2.2s}
.acceso{position:relative;overflow:hidden;isolation:isolate;transition:transform .35s var(--suave)}
.acceso::before{content:"";position:absolute;inset:0 -20px;z-index:-1;background:linear-gradient(90deg,rgba(201,180,138,.18),rgba(201,180,138,0) 85%);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--suave)}
a.acceso:hover::before,a.acceso:focus-visible::before{transform:scaleX(1)}
a.acceso:active{transform:scale(.985)}
.acceso .ic{position:relative;background:var(--papel);transition:transform .4s var(--suave),box-shadow .4s}
.acceso .ic::before{content:"";position:absolute;inset:-3px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(201,180,138,0) 0 62%,rgba(201,180,138,.9) 82%,#F4E4BE 88%,rgba(201,180,138,0) 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));
  animation:girar 4.5s linear infinite}
.acceso .ic::after{content:"";position:absolute;inset:-1px;border-radius:50%;box-shadow:0 0 0 0 rgba(201,180,138,.55);animation:latido 3.6s ease-out infinite}
.accesos li:nth-child(2) .ic::before{animation-delay:-1.1s}.accesos li:nth-child(2) .ic::after{animation-delay:.9s}
.accesos li:nth-child(3) .ic::before{animation-delay:-2.2s}.accesos li:nth-child(3) .ic::after{animation-delay:1.8s}
.accesos li:nth-child(4) .ic::before{animation-delay:-3.3s}.accesos li:nth-child(4) .ic::after{animation-delay:2.7s}
a.acceso:hover .ic{transform:scale(1.08) rotate(-6deg);box-shadow:0 8px 22px rgba(168,141,92,.35)}
@keyframes girar{to{transform:rotate(360deg)}}
@keyframes latido{0%{box-shadow:0 0 0 0 rgba(201,180,138,.5)}70%{box-shadow:0 0 0 12px rgba(201,180,138,0)}100%{box-shadow:0 0 0 0 rgba(201,180,138,0)}}
.acceso b{background:linear-gradient(90deg,var(--tinta) 0 40%,var(--champan-osc) 50%,var(--tinta) 60% 100%);background-size:250% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;transition:background-position .9s var(--suave)}
a.acceso:hover b{color:transparent;background-position:0 0}
/* Botón principal: brillo que recorre y borde dorado vivo */
.acceso.principal{background:linear-gradient(110deg,#0E0D0C,#1D1915 55%,#0E0D0C);box-shadow:inset 0 1px 0 rgba(201,180,138,.55),inset 0 -1px 0 rgba(201,180,138,.55)}
.acceso.principal::before{background:linear-gradient(90deg,rgba(201,180,138,.22),rgba(201,180,138,0) 85%)}
.acceso.principal::after{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;z-index:-1;pointer-events:none;
  background:linear-gradient(105deg,transparent 0%,rgba(244,228,190,.0) 30%,rgba(244,228,190,.28) 50%,rgba(244,228,190,0) 70%,transparent 100%);
  transform:translateX(-130%) skewX(-12deg);animation:brillo 4.2s var(--suave) 2.6s infinite}
@keyframes brillo{0%{transform:translateX(-130%) skewX(-12deg)}45%,100%{transform:translateX(330%) skewX(-12deg)}}
.acceso.principal .ic{background:transparent;border-color:rgba(201,180,138,.45);color:var(--champan)}
.acceso.principal .ic::before{animation-duration:3s}
.acceso.principal .fl{color:var(--champan);animation:empujar 2.2s ease-in-out infinite}
@keyframes empujar{0%,100%{transform:none}50%{transform:translateX(5px)}}
.acceso.principal b{background-image:linear-gradient(90deg,#fff 0 40%,#F4E4BE 50%,#fff 60% 100%)}
/* Onda al tocar */
.onda{position:absolute;border-radius:50%;pointer-events:none;z-index:-1;background:radial-gradient(circle,rgba(201,180,138,.45),rgba(201,180,138,0) 70%);transform:scale(0);animation:onda .8s ease-out forwards}
@keyframes onda{to{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.acceso .ic::before,.acceso .ic::after,.acceso.principal::after,.acceso.principal .fl{animation:none!important}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}
</style>

        <span class="perfil-tx"><b>omshopve<span class="verificado" aria-hidden="true">✓</span></b><small>Nueva colección</small></span>
      </div>
    </div>
    <div class="toques">
      <button class="atras" id="atras" type="button" aria-label="Foto anterior"></button>

<script>
(function(){
  var t=document.getElementById("tarjeta"),quieto=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var figs=document.querySelectorAll("#fotos figure"),barrasProg=document.querySelectorAll("#progreso i"),barras=document.querySelectorAll("#barras i");
  var PIEZAS=[["Blazer","115 $"],["Vestido","60 $"],["Vestido blanco","70 $"],["Cazadora Bomber","55 $"],["Corset","50 $"],["Jeans wide leg","70 $"]];
  var DUR=4200,i=0,trans=0,pausado=false,ultimo=null,etq=document.getElementById("etiqueta"),etqTx=document.getElementById("etiqueta-tx");
  var frases=["Nueva colección","OM Shop","Pedidos por WhatsApp","@omshopve"];
  var una=frases.map(function(f){return "<span>"+f+"</span>";}).join("");
  document.getElementById("cinta").innerHTML=una+una+una+una;

  function pintarBarras(){
    for(var k=0;k<barrasProg.length;k++){
      var v=k<i?1:(k>i?0:Math.min(trans/DUR,1));
      barrasProg[k].style.transform="scaleX("+v+")";
    }
  }
  function ir(n){
    figs[i].classList.remove("on");barras[i].classList.remove("on");
    i=(n+figs.length)%figs.length;trans=0;
    figs[i].classList.add("on");barras[i].classList.add("on");
    etq.classList.add("cambia");
    setTimeout(function(){etqTx.innerHTML="<b>"+PIEZAS[i][0]+"</b> · "+PIEZAS[i][1];etq.classList.remove("cambia");},300);
    pintarBarras();
  }
  function cuadro(ts){
    if(ultimo!=null && !pausado && !quieto){trans+=ts-ultimo;if(trans>=DUR){ir(i+1);}pintarBarras();}
    ultimo=ts;requestAnimationFrame(cuadro);
  }
  requestAnimationFrame(cuadro);

  /* Toques a los lados y mantener para pausar */
  var mantener=null,fueLargo=false;
  ["atras","adelante"].forEach(function(id){
    var b=document.getElementById(id);
    b.addEventListener("pointerdown",function(){fueLargo=false;mantener=setTimeout(function(){fueLargo=true;pausado=true;t.classList.add("pausa");},260);});
    b.addEventListener("pointerup",function(){clearTimeout(mantener);if(fueLargo){pausado=false;t.classList.remove("pausa");}});
    b.addEventListener("pointerleave",function(){clearTimeout(mantener);if(fueLargo){pausado=false;t.classList.remove("pausa");}});
    b.addEventListener("click",function(){if(fueLargo){fueLargo=false;return;}ir(id==="atras"?i-1:i+1);});
  });

  /* Entrar: botón o deslizar hacia arriba */
  function entrar(){
    if(t.classList.contains("abierta"))return;
    t.classList.add("abierta");
    setTimeout(function(){var a=document.querySelector(".acceso.principal");if(a)a.focus({preventScroll:true});},2300);
  }
  document.getElementById("entrar").addEventListener("click",entrar);
  var y0=null;
  document.getElementById("historia").addEventListener("touchstart",function(e){y0=e.touches[0].clientY;},{passive:true});
  document.getElementById("historia").addEventListener("touchend",function(e){if(y0!=null&&y0-e.changedTouches[0].clientY>60)entrar();y0=null;},{passive:true});
  document.addEventListener("keydown",function(e){
    if(t.classList.contains("abierta"))return;
    if(e.key==="ArrowRight")ir(i+1);else if(e.key==="ArrowLeft")ir(i-1);else if(e.key==="ArrowUp")entrar();
  });
  document.querySelectorAll("a.acceso").forEach(function(a){
    a.addEventListener("pointerdown",function(e){
      var r=a.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.6,o=document.createElement("span");
      o.className="onda";o.style.width=o.style.height=d+"px";o.style.left=(e.clientX-r.left-d/2)+"px";o.style.top=(e.clientY-r.top-d/2)+"px";
      a.appendChild(o);setTimeout(function(){o.remove();},850);
    });
  });
})();
</script>
<script>
(function(){
  var quieto=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv=document.getElementById("chispas"),cx=cv.getContext("2d"),dpr=Math.min(window.devicePixelRatio||1,2),W=0,H=0,P=[],mx=0,my=0;
  function medir(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);}
  function nueva(inicio){var z=Math.random();return{x:Math.random()*W,y:inicio?Math.random()*H:H+10,z:.25+z*.75,f:Math.random()*6.28,v:.15+z*.45,c:Math.random()<.7?"244,228,190":"255,255,255"};}
  medir();var N=Math.round(Math.min(110,Math.max(50,W*H/14000)));for(var k=0;k<N;k++)P.push(nueva(true));
  addEventListener("resize",medir);
  addEventListener("pointermove",function(e){mx=e.clientX/W-.5;my=e.clientY/H-.5;
    var a=document.getElementById("aura"),esc=document.getElementById("escenario");
    if(e.pointerType==="mouse"&&!esc.classList.contains("dentro")){a.style.setProperty("--ry",(mx*12).toFixed(2)+"deg");a.style.setProperty("--rx",(-my*9).toFixed(2)+"deg");}
  });
  function estrella(x,y,r,al,c){
    cx.globalAlpha=al;cx.fillStyle="rgba("+c+",1)";
    cx.beginPath();cx.moveTo(x,y-r*3);cx.quadraticCurveTo(x,y,x+r*3,y);cx.quadraticCurveTo(x,y,x,y+r*3);cx.quadraticCurveTo(x,y,x-r*3,y);cx.quadraticCurveTo(x,y,x,y-r*3);cx.fill();
  }
  function cuadro(t){
    cx.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){
      var p=P[i];
      if(!quieto){p.y-=p.v;p.x+=Math.sin(t/2400+p.f)*.15*p.z;if(p.y<-10)P[i]=p=nueva(false);}
      var px=p.x+mx*40*p.z,py=p.y+my*30*p.z,tw=.35+.65*Math.abs(Math.sin(t/900*p.z+p.f)),r=.6+p.z*1.6;
      var g=cx.createRadialGradient(px,py,0,px,py,r*5);g.addColorStop(0,"rgba("+p.c+","+(.55*tw*p.z)+")");g.addColorStop(1,"rgba("+p.c+",0)");
      cx.globalAlpha=1;cx.fillStyle=g;cx.beginPath();cx.arc(px,py,r*5,0,6.283);cx.fill();
      if(p.z>.82&&tw>.8)estrella(px,py,r*.9,(tw-.8)*4,p.c);
    }
    cx.globalAlpha=1;
    if(!quieto)requestAnimationFrame(cuadro);
  }
  requestAnimationFrame(cuadro);
  document.getElementById("entrar").addEventListener("click",function(){document.getElementById("escenario").classList.add("dentro");});
  document.getElementById("historia").addEventListener("touchend",function(){setTimeout(function(){if(document.getElementById("tarjeta").classList.contains("abierta"))document.getElementById("escenario").classList.add("dentro");},50);},{passive:true});
})();
